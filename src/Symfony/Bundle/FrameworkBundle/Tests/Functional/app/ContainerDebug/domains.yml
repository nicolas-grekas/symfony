imports:
    - { resource: ../config/default.yml }

services:
    Symfony\Bundle\FrameworkBundle\Tests\Fixtures\DomainInternal:
        tags:
            - { name: container.domain, domain: billing }

    Stringable:
        alias: Symfony\Bundle\FrameworkBundle\Tests\Fixtures\DomainInternal
        allowed_domains: [migrations]

    billing_consumer:
        class: ArrayObject
        public: true
        tags:
            - { name: container.domain, domain: billing }
        arguments:
            - ['@Symfony\Bundle\FrameworkBundle\Tests\Fixtures\DomainInternal']

    migration:
        class: ArrayObject
        public: true
        tags:
            - { name: container.domain, domain: migrations, restricted: true }
        arguments:
            - ['@Stringable']

    exception_consumer:
        class: ArrayObject
        public: true
        arguments:
            - [!reference { service: Symfony\Bundle\FrameworkBundle\Tests\Fixtures\DomainInternal, allow_domain: billing }]

    stdClass:
        class: stdClass
        public: true
